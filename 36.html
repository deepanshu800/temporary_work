<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;

        background: grey;

        /* color: white; */
      }

      #hero {
        height: 100vh;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card {
        height: 400px;
        width: 300px;

        background-image: url(./heavyweight_pen.webp);
        background-repeat: none;
        background-size: cover;
        background-position: center;

        text-align: center;
        /* justify-content: center; */
      }

      ul {
        text-align: left;
      }

      li {
        list-style-type: square;
      }
    </style>
  </head>
  <body>
    <div id="hero">
      <div class="card">
        <h2>Deepanshu</h2>
        <p>My name is deepanshu, and i am an assistant professor</p>
        <ul>
          <li>Helo</li>
          <li>Meri</li>
          <li>Jaan</li>
          <li>Cheeku</li>
        </ul>
      </div>
    </div>
  </body>
</html>
